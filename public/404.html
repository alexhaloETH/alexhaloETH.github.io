<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALEXHALO3115</title>
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        var fallback = '/?spa_redirect=' + encodeURIComponent(target);
        try {
          window.sessionStorage.setItem('portfolio_spa_redirect', target);
        } catch (error) {
          window.location.replace(fallback);
          return;
        }
        window.location.replace('/');
      }());
    </script>
  </head>
  <body></body>
</html>
